services:
  lightvid-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "18778:80"
    depends_on:
      lightvid-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lightvid-network

  lightvid-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18668:18668"
    volumes:
      - ./data:/app/data
    env_file:
      - ./backend/.env
    working_dir: /app
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 18668"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18668/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - lightvid-network

networks:
  lightvid-network:
    driver: bridge